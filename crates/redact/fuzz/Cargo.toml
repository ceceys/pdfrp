[package]
name = "migez-redact-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Detached from the Pdfrp workspace: run with `cargo +nightly fuzz run apply`
# from crates/redact/.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
migez-cos = { path = "../../cos" }
migez-redact = { path = ".." }

[[bin]]
name = "apply"
path = "fuzz_targets/apply.rs"
test = false
doc = false
bench = false
